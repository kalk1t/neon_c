<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roadsters Race — C First Flight</title>
  <link rel="icon" href="data:,">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a1a;color:#eaf4ff;font:16px system-ui}
    canvas{width:100%;height:100%;display:block;outline:none}
    #status{position:fixed;inset:0;display:grid;place-items:center;background:#070a1a;pointer-events:none}
    #status:empty{display:none}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Roadsters Race game"></canvas>
  <div id="status" role="status">Loading Roadsters Race…</div>
  <script>
    // Platform shell only: all game simulation, rendering and UI are compiled C.
    const query=new URLSearchParams(location.search);
    var Module={
      canvas:document.getElementById('canvas'),
      arguments:[...(query.has('smoke')?['--smoke-test']:[]),...(query.has('fallback')?['--fallback']:[])],
      setStatus(text){document.getElementById('status').textContent=text;},
      onAbort(reason){document.getElementById('status').textContent='Unable to start the game. '+reason;}
    };
    Module.canvas.addEventListener('contextmenu',event=>event.preventDefault());
  </script>
  {{{ SCRIPT }}}
</body>
</html>
